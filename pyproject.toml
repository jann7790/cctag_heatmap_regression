[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cctag-heatmap-regression"
version = "0.1.0"
description = "Synthetic CCTag dataset generation, training, and inference workspace."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<2.4",
    "opencv-python==4.13.0.92",
    "timm>=1.0.0",
    # torch is a hard cu126 dependency (this is a Linux GPU-only repo). It is NOT
    # an optional extra: when torch lives only under extras, a bare `uv run/sync`
    # (no --extra) resolves the transitive torch (pulled by timm) from pypi.org's
    # generic 2.11.0 build, which depends on nvidia-*-cu13 wheels and clobbers the
    # cu126 cuDNN libs -> CUDNN_STATUS_NOT_INITIALIZED. Pinning it here removes the
    # no-extra resolution path entirely, so cu13 can never enter the lock or venv.
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.optional-dependencies]
# Backward-compat no-op alias: torch is now a base dependency, so `--extra cu126`
# is redundant, but it is kept (empty) so existing `uv run/sync --extra cu126`
# invocations in scripts and docs keep working.
cu126 = []
# Detection (acquisition) stage: YOLO-nano via ultralytics. Kept isolated.
detect = [
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
# torch==2.11.0+cu126 only has Linux wheels; restrict resolution to Linux so the
# lock does not try (and fail) to find macOS/Windows cu126 wheels.
environments = [
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

# Official PyTorch index. The sjtu/aliyun/tuna `pytorch-wheels` mirrors all 404
# now (they restructured), so we point at the canonical index directly.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
